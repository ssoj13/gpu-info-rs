[package]
name = "gpu-info-rs"
version = "0.1.0"
edition = "2024"
description = "Portable GPU info: wgpu capability reporting (limits/features/formats) + DXGI VRAM budget, plus OS-level VRAM/RAM query (no GPU context). One-stop GPU info crate with a diagnostic CLI."
license = "MIT OR Apache-2.0"

[lib]
name = "gpu_info"
path = "src/lib.rs"

[[bin]]
name = "gpu-info"
path = "src/bin/wgpu-info.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# CLI binary deps. The library itself never needs clap.
cli = ["dep:clap"]

[dependencies]
# OS-level VRAM/RAM (no GPU context) - re-exported as `wgpu_info::gpu_mem`.
# Pinned to match the workspace wgpu in gitnexus-rs / vfx-rs (avoids a second wgpu+naga copy).
# `serde` lets us serialize wgpu's own Limits/AdapterInfo straight into the report.
wgpu = { version = "30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wgpu adapter enumeration / device creation are async; we block on them so the
# public query API stays synchronous and ergonomic for non-async callers.
pollster = "0.4"
clap = { version = "4", features = ["derive"], optional = true }
log = "0.4"
# GpuImage host<->GPU boundary: Rgba16Float stores half-floats, so the f32 host API converts via
# `half::f16`; `bytemuck` reinterprets the packed halves as bytes for `write_texture` / readback.
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"
thiserror = "2"

# ---------------------------------------------------------------------------
# Live-VRAM platform backends (see `src/vram.rs`). Each is declared ONLY under
# its own target so a non-Windows crate never pulls the `windows` crate, etc.
# ---------------------------------------------------------------------------

# Windows: DXGI used/budget query (the VERIFIED path). Backend-agnostic.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
] }

# Linux: Vulkan VK_EXT_memory_budget via `Adapter::as_hal` (WRITTEN, UNVERIFIED).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }

# macOS: Metal MTLDevice via wgpu Device::as_hal (objc2, same types as wgpu-hal 30).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", features = ["MTLDevice"] }
